<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Crown Beauty Salon — премиальный салон красоты в Анталье. Маникюр, педикюр, лазерная эпиляция.">
<title>Crown Beauty Salon 👑 Antalya</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,600;1,700&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:17px}
body{font-family:'Inter',sans-serif;color:#2D2D2D;overflow-x:hidden;background:#fff;line-height:1.65}
h1,h2,h3,h4{font-family:'Playfair Display',serif;line-height:1.15}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#FFF5F9}
::-webkit-scrollbar-thumb{background:linear-gradient(to bottom,#F9A8C9,#E91E8C);border-radius:3px}
section{scroll-margin-top:104px;position:relative}
/* ── DIAMOND MESH TEXTURE ─────────────────────── */
section::before{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:
    repeating-linear-gradient(
      -45deg,
      transparent 0,
      transparent 26px,
      rgba(249,168,201,.07) 26px,
      rgba(249,168,201,.07) 27.5px
    ),
    repeating-linear-gradient(
      45deg,
      transparent 0,
      transparent 26px,
      rgba(249,168,201,.07) 26px,
      rgba(249,168,201,.07) 27.5px
    )
}
/* Tiny rose dot at each diamond intersection */
section::after{
  content:'';
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:0;
  background-image:radial-gradient(circle,rgba(233,30,140,.06) 1.2px,transparent 1.2px);
  background-size:37px 37px;
  background-position:18px 18px
}
section>div{position:relative;z-index:1}

/* ── AURORA BACKGROUND ────────────────────────── */
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.aurora-a,.aurora-b,.aurora-c,.aurora-d,.aurora-e{position:absolute;border-radius:50%}

.aurora-a{
  width:90vw;height:55vw;top:-15%;left:-25%;
  background:radial-gradient(ellipse at center,rgba(233,30,140,.28) 0%,rgba(233,30,140,.1) 40%,transparent 70%);
  filter:blur(72px);
  animation:au-a 20s ease-in-out infinite alternate
}
.aurora-b{
  width:75vw;height:65vw;top:25%;right:-20%;
  background:radial-gradient(ellipse at center,rgba(160,40,210,.22) 0%,rgba(180,60,220,.08) 45%,transparent 70%);
  filter:blur(88px);
  animation:au-b 26s ease-in-out infinite alternate
}
.aurora-c{
  width:100vw;height:45vw;bottom:-10%;left:5%;
  background:radial-gradient(ellipse at center,rgba(249,168,201,.2) 0%,rgba(249,168,201,.07) 50%,transparent 72%);
  filter:blur(80px);
  animation:au-c 23s ease-in-out infinite alternate
}
.aurora-d{
  width:60vw;height:75vw;top:35%;left:25%;
  background:radial-gradient(ellipse at center,rgba(140,20,180,.18) 0%,transparent 65%);
  filter:blur(100px);
  animation:au-d 18s ease-in-out infinite alternate
}
.aurora-e{
  width:55vw;height:40vw;top:10%;left:40%;
  background:radial-gradient(ellipse at center,rgba(252,180,220,.16) 0%,transparent 68%);
  filter:blur(64px);
  animation:au-e 30s ease-in-out infinite alternate
}

@keyframes au-a{
  0%  {transform:translate(0,0) rotate(-8deg) scale(1)}
  100%{transform:translate(18vw,12vh) rotate(18deg) scale(1.25)}
}
@keyframes au-b{
  0%  {transform:translate(0,0) rotate(5deg) scale(1)}
  100%{transform:translate(-14vw,18vh) rotate(-22deg) scale(1.18)}
}
@keyframes au-c{
  0%  {transform:translate(0,0) rotate(0deg) scale(1)}
  100%{transform:translate(10vw,-14vh) rotate(14deg) scale(1.12)}
}
@keyframes au-d{
  0%  {transform:translate(0,0) rotate(10deg) scale(1)}
  100%{transform:translate(-8vw,-10vh) rotate(-18deg) scale(1.3)}
}
@keyframes au-e{
  0%  {transform:translate(0,0) rotate(-5deg) scale(1)}
  100%{transform:translate(12vw,16vh) rotate(25deg) scale(1.15)}
}

/* ── KEYFRAMES ────────────────────────────────── */
@keyframes fadeInUp{from{opacity:0;transform:translateY(36px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInScale{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes crownFloat{
  0%,100%{transform:translateY(0) rotate(-2deg) scale(1);filter:drop-shadow(0 8px 32px rgba(233,30,140,.45)) drop-shadow(0 0 18px rgba(249,168,201,.6))}
  25%{transform:translateY(-10px) rotate(1.5deg) scale(1.03);filter:drop-shadow(0 16px 48px rgba(233,30,140,.6)) drop-shadow(0 0 32px rgba(249,168,201,.8))}
  50%{transform:translateY(-18px) rotate(-1deg) scale(1.05);filter:drop-shadow(0 20px 56px rgba(233,30,140,.7)) drop-shadow(0 0 42px rgba(249,168,201,.9)) drop-shadow(0 0 8px rgba(255,255,255,.8))}
  75%{transform:translateY(-8px) rotate(2deg) scale(1.02);filter:drop-shadow(0 14px 44px rgba(233,30,140,.55)) drop-shadow(0 0 28px rgba(249,168,201,.75))}
}
@keyframes pulseRing{0%,100%{box-shadow:0 0 0 0 rgba(233,30,140,.45)}50%{box-shadow:0 0 0 18px rgba(233,30,140,0)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes scrollDrop{0%{opacity:0;transform:scaleY(0);transform-origin:top}60%{opacity:1}100%{opacity:0;transform:scaleY(1);transform-origin:top}}
@keyframes menuSlideDown{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}

/* ── REVEAL SYSTEM ────────────────────────────── */
.rv{opacity:0;transform:translateY(32px);transition:opacity .75s ease,transform .75s ease}
.rv.in{opacity:1;transform:translateY(0)}
.rv-s{opacity:0;transform:scale(.88);transition:opacity .7s ease,transform .7s ease}
.rv-s.in{opacity:1;transform:scale(1)}
.rv-l{opacity:0;transform:translateX(-44px);transition:opacity .75s ease,transform .75s ease}
.rv-l.in{opacity:1;transform:translateX(0)}
.rv-r{opacity:0;transform:translateX(44px);transition:opacity .75s ease,transform .75s ease}
.rv-r.in{opacity:1;transform:translateX(0)}

/* ── GRAD / GLASS UTILS ───────────────────────── */
.gtext{background:linear-gradient(135deg,#E91E8C,#F9A8C9);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gbg{background:linear-gradient(135deg,#E91E8C,#c4106e)}
.gbg-anim{background:linear-gradient(270deg,#E91E8C,#F9A8C9,#FCE4EC,#E91E8C);background-size:400% 400%;animation:gradShift 7s ease infinite}

/* ── TOP BAR ──────────────────────────────────── */
.topbar{position:fixed;top:0;left:0;right:0;z-index:1002;height:36px;background:#E5177E;display:flex;align-items:center;padding:0 20px;gap:0;font-size:13px;color:#fff}
.topbar-left{display:flex;align-items:center;gap:0;flex:1;overflow:hidden;min-width:0}
.topbar-item{display:flex;align-items:center;gap:5px;white-space:nowrap;color:rgba(255,255,255,.93);text-decoration:none;transition:opacity .2s;flex-shrink:0}
.topbar-item:hover{opacity:.72}
.topbar-sep{color:rgba(255,255,255,.28);margin:0 10px;flex-shrink:0}
.topbar-pipe{color:rgba(255,255,255,.25);margin:0 14px;flex-shrink:0}
.topbar-open{background:rgba(255,255,255,.2);padding:2px 9px;border-radius:10px;font-size:11.5px;font-weight:600;display:flex;align-items:center;gap:5px;flex-shrink:0}
.topbar-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;box-shadow:0 0 5px rgba(74,222,128,.7)}
.topbar-right{display:flex;align-items:center;flex-shrink:0}
.lang-group{display:flex;align-items:center;gap:0;background:#fff;border-radius:50px;padding:3px 4px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.lang-pill{padding:3px 10px;border-radius:50px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:500;font-size:12px;transition:all 0.25s cubic-bezier(0.4,0,0.2,1);display:flex;align-items:center;gap:3px;line-height:1;background:transparent;color:#888}
.lang-pill.active{background:#E5177E;color:#fff;font-weight:700;box-shadow:0 0 10px rgba(229,23,126,.4)}
.lang-pill.inactive{background:transparent;color:#555}
.lang-pill.inactive:hover{background:rgba(229,23,126,.1);color:#E5177E;transform:scale(1.12);box-shadow:0 0 8px rgba(229,23,126,.25)}

/* ── NAV GLASS ────────────────────────────────── */
.nav-glass{position:fixed;top:36px;left:0;right:0;z-index:1000;height:68px;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  background:rgba(255,255,255,.75);
  border-bottom:1px solid rgba(244,167,192,.3);
  box-shadow:0 4px 24px rgba(229,23,126,.08);
  transition:background .4s,box-shadow .4s,border-color .4s,backdrop-filter .4s}
.nav-glass.scrolled{
  backdrop-filter:blur(32px) saturate(200%);-webkit-backdrop-filter:blur(32px) saturate(200%);
  background:rgba(255,255,255,.88);
  box-shadow:0 8px 40px rgba(229,23,126,.13),0 1px 0 rgba(255,255,255,.6);
  border-bottom:1px solid rgba(244,167,192,.45)}
.nav-glass-shine{position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.95) 20%,rgba(255,255,255,.95) 80%,transparent 100%);pointer-events:none;z-index:2}
.nav-glass-progress{position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,#E5177E,#F9A8C9,#c4106e);background-size:200% 100%;animation:gradShift 3s ease infinite;transition:width .12s linear;border-radius:0 2px 2px 0;pointer-events:none;z-index:3}
.nav-glass-inner{position:relative;z-index:1;height:100%;padding:0 28px;display:flex;align-items:center;justify-content:space-between}

/* Nav links — liquid glass pill style */
.nav-link{
  position:relative;text-decoration:none;color:#3a1a26;font-size:.84rem;font-weight:500;
  letter-spacing:.03em;padding:6px 18px;border-radius:50px;
  border:1.5px solid transparent;
  transition:all 0.4s cubic-bezier(0.4, 0, 0.2, 1)
}
.nav-link:hover{
  color:#E5177E;
  background:rgba(229,23,126,.08);
  border-color:rgba(229,23,126,.2)
}
.nav-link.act{
  color:#E5177E;
  font-weight:600;
  background:rgba(229,23,126,.12);
  border:1.5px solid rgba(229,23,126,.35);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-radius:50px;
  box-shadow:0 2px 12px rgba(229,23,126,.12)
}

/* Записаться button — liquid glass */
.nav-cta{
  text-decoration:none;
  padding:10px 24px;
  border-radius:50px;
  background:rgba(255,255,255,.45);
  border:1.5px solid rgba(255,255,255,.8);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 16px rgba(229,23,126,.15),inset 0 1px 0 rgba(255,255,255,.7);
  color:#E5177E;
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:.82rem;
  letter-spacing:.03em;
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
  white-space:nowrap;
  display:inline-flex;align-items:center
}
.nav-cta:hover{
  background:#E5177E;
  border-color:#E5177E;
  color:#fff;
  box-shadow:0 0 20px rgba(229,23,126,.35);
  transform:scale(1.08)
}

/* WA circle button in nav */
.nav-wa-btn{
  width:38px;height:38px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1.5px solid rgba(37,211,102,.45);
  background:rgba(37,211,102,.08);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:all 0.3s cubic-bezier(0.4,0,0.2,1);color:#25D366;text-decoration:none;
  box-shadow:0 2px 10px rgba(37,211,102,.15)
}
.nav-wa-btn:hover{
  background:rgba(37,211,102,.18);
  border-color:rgba(37,211,102,.65);
  transform:scale(1.08);
  box-shadow:0 4px 18px rgba(37,211,102,.3)
}

/* ── SERVICE CARDS ────────────────────────────── */
.scard{
  transition:transform .38s cubic-bezier(.23,1,.32,1),box-shadow .38s ease,border-color .38s ease;
  cursor:pointer;position:relative
}
.scard:hover{
  transform:translateY(-11px) scale(1.012);
  border-color:rgba(233,30,140,.55)!important;
  box-shadow:
    0 0 0 1px rgba(233,30,140,.35),
    0 0 10px  rgba(233,30,140,.45),
    0 0 30px  rgba(233,30,140,.28),
    0 0 70px  rgba(233,30,140,.14),
    0 0 120px rgba(233,30,140,.07),
    0 22px 52px rgba(233,30,140,.2)!important
}
/* top accent bar */
.scard-bar{
  position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,rgba(233,30,140,.2) 30%,rgba(249,168,201,.5) 50%,rgba(233,30,140,.2) 70%,transparent);
  border-radius:24px 24px 0 0;
  transition:background .38s ease,box-shadow .38s ease
}
.scard:hover .scard-bar{
  background:linear-gradient(90deg,transparent,#E91E8C 30%,#F9A8C9 50%,#E91E8C 70%,transparent);
  box-shadow:0 0 10px rgba(233,30,140,.6),0 0 28px rgba(233,30,140,.35)
}
/* icon */
.scard-icon{
  display:inline-block;font-size:2.4rem;line-height:1;
  transition:filter .38s ease,transform .38s ease
}
.scard:hover .scard-icon{}
/* shimmer sweep */
.scard .shimmer-line{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.scard .shimmer-line::after{content:'';position:absolute;top:0;left:0;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%)}
.scard:hover .shimmer-line::after{animation:shimmer .65s ease}
/* price badge pulse on hover */
.scard:hover .scard-price{
  box-shadow:0 0 8px rgba(233,30,140,.55),0 0 20px rgba(233,30,140,.3)
}

/* ── GALLERY ──────────────────────────────────── */
.gcrd{border-radius:18px;overflow:hidden;cursor:pointer;position:relative}
.gcrd-inner{transition:transform .55s cubic-bezier(.23,1,.32,1);width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.gcrd:hover .gcrd-inner{transform:scale(1.09)}
.gcrd-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(233,30,140,.8) 0%,rgba(233,30,140,.25) 55%,transparent 100%);opacity:0;transition:opacity .35s;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:18px;gap:6px}
.gcrd:hover .gcrd-ov{opacity:1}
.look-btn{background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;font-weight:700;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:6px 16px;border-radius:20px;transform:translateY(10px);transition:transform .35s ease .05s}
.gcrd:hover .look-btn{transform:translateY(0)}

/* ── FILTER TABS ──────────────────────────────── */
.ftab{padding:8px 20px;border-radius:24px;border:1.5px solid rgba(249,168,201,.45);background:transparent;cursor:pointer;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;color:#888;transition:all .22s;white-space:nowrap}
.ftab.on{background:linear-gradient(135deg,#E91E8C,#c4106e);color:#fff;border-color:transparent;box-shadow:0 4px 16px rgba(233,30,140,.3)}
.ftab:not(.on):hover{border-color:#E91E8C;color:#E91E8C}

/* ── SCROLL TO TOP ────────────────────────────── */
.stt-btn{
  position:fixed;bottom:28px;left:28px;z-index:9998;
  width:54px;height:54px;
  border:none;cursor:pointer;background:transparent;padding:0;
  transition:opacity .42s ease,transform .42s cubic-bezier(.23,1,.32,1)
}
.stt-inner{
  position:absolute;inset:6px;border-radius:50%;
  background:linear-gradient(135deg,#E91E8C,#c4106e);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 18px rgba(233,30,140,.45),inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .26s ease,box-shadow .26s ease
}
.stt-btn:hover .stt-inner{
  transform:scale(1.1) translateY(-2px);
  box-shadow:
    0 0 8px  rgba(233,30,140,.65),
    0 0 22px rgba(233,30,140,.38),
    0 0 50px rgba(233,30,140,.18),
    0 8px 28px rgba(233,30,140,.4),
    inset 0 1px 0 rgba(255,255,255,.45)
}
.stt-arrow{transition:transform .26s ease}
.stt-btn:hover .stt-arrow{transform:translateY(-2px)}

@keyframes stt-pulse{
  0%  {transform:scale(1);opacity:.55}
  70% {transform:scale(1.55);opacity:0}
  100%{transform:scale(1.55);opacity:0}
}
.stt-ring{
  position:absolute;inset:6px;border-radius:50%;
  border:2px solid rgba(233,30,140,.55);
  animation:stt-pulse 2.2s ease-out infinite;
  pointer-events:none
}

/* ── FLOAT BTNS (LIQUID GLASS) ────────────────── */
.fb-wrap{position:fixed;bottom:28px;right:28px;z-index:9997;display:flex;gap:12px;align-items:center}
.fb{display:flex;align-items:center;justify-content:center;gap:8px;height:54px;border-radius:30px;border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;font-size:.82rem;letter-spacing:.04em;transition:transform .28s ease,box-shadow .28s ease;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);white-space:nowrap}
.fb:hover{transform:translateY(-4px) scale(1.04)}
.fb-wa{padding:0 22px;background:rgba(37,211,102,.18);border:1.5px solid rgba(37,211,102,.5);color:#fff;box-shadow:0 8px 32px rgba(37,211,102,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.fb-wa:hover{box-shadow:0 16px 40px rgba(37,211,102,.45),inset 0 1px 0 rgba(255,255,255,.3)}
.fb-book{padding:0 22px;background:rgba(233,30,140,.18);border:1.5px solid rgba(233,30,140,.5);color:#fff;box-shadow:0 8px 32px rgba(233,30,140,.32),inset 0 1px 0 rgba(255,255,255,.25)}
.fb-book:hover{box-shadow:0 16px 40px rgba(233,30,140,.45),inset 0 1px 0 rgba(255,255,255,.3)}

/* ── MARQUEE ──────────────────────────────────── */
.mq-wrap{overflow:hidden;width:100%}
.mq-inner{display:inline-flex;animation:marquee 28s linear infinite;white-space:nowrap}
.mq-inner:hover{animation-play-state:paused}

/* ── CURSOR ───────────────────────────────────── */
.cursor{display:inline-block;width:3px;height:.9em;background:#E91E8C;margin-left:3px;vertical-align:middle;border-radius:2px;animation:blink 1s step-end infinite}

/* ── TEAM CARD ────────────────────────────────── */
.team-card{transition:transform .3s,box-shadow .3s}
.team-card:hover{transform:translateY(-8px);box-shadow:0 20px 44px rgba(233,30,140,.15)!important}

/* ── REVIEWS CAROUSEL ─────────────────────────── */

/* Gradient-border wrapper — the "frame" */
.rvcard-wrap{
  position:relative;
  border-radius:26px;
  padding:1.5px;
  background:linear-gradient(135deg,
    rgba(233,30,140,.28) 0%,
    rgba(160,40,210,.2)  40%,
    rgba(249,168,201,.32) 100%
  );
  flex-shrink:0
}

/* Glass panel inside */
.rvcard{
  border-radius:25px;
  padding:28px 24px;
  height:100%;
  background:rgba(255,244,250,.84);
  backdrop-filter:blur(24px) saturate(1.6);
  -webkit-backdrop-filter:blur(24px) saturate(1.6)
}

/* Avatar */
.rvcard-av{
  width:46px;height:46px;border-radius:50%;
  background:linear-gradient(135deg,#F9A8C9,#E91E8C);
  display:flex;align-items:center;justify-content:center;
  color:white;fontWeight:700;font-size:1.05rem;
  font-family:'Playfair Display',serif;flex-shrink:0
}

/* Stars */
.rvcard-stars{
  color:#E91E8C;font-size:.93rem;letter-spacing:2px
}

/* Arrow buttons */
.rv-arr{
  position:absolute;top:50%;transform:translateY(-50%);
  width:44px;height:44px;border-radius:50%;
  border:1.5px solid rgba(233,30,140,.35);
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);

const Ctx=createContext();

function useReveal(cls='rv'){
  const ref=useRef(null);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){el.classList.add('in');obs.disconnect();}
    },{threshold:.1});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);
  return ref;
}

function useInView(threshold=.2){
  const ref=useRef(null);
  const [inView,setInView]=useState(false);
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{
      if(e.isIntersecting){setInView(true);obs.disconnect();}
    },{threshold});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);
  return [ref,inView];
}

function useCounter(target,inView,dec=0,dur=1800){
  const [v,setV]=useState(0);
  useEffect(()=>{
    if(!inView) return;
    let s=0;
    const step=target/(dur/16);
    const t=setInterval(()=>{
      s+=step;
      if(s>=target){setV(target);clearInterval(t);}
      else setV(dec>0?parseFloat(s.toFixed(dec)):Math.floor(s));
    },16);
    return()=>clearInterval(t);
  },[inView,target,dec,dur]);
  return v;
}

function useTypewriter(text,speed=55){
  const [disp,setDisp]=useState('');
  const [done,setDone]=useState(false);
  useEffect(()=>{
    setDisp(''); setDone(false);
    let i=0;
    const t=setInterval(()=>{
      if(i<text.length){setDisp(text.slice(0,i+1));i++;}
      else{setDone(true);clearInterval(t);}
    },speed);
    return()=>clearInterval(t);
  },[text,speed]);
  return{disp,done};
}

function useParallax(){
  const [off,setOff]=useState(0);
  useEffect(()=>{
    if(window.innerWidth<=768) return;
    let raf=null;
    const fn=()=>{raf=requestAnimationFrame(()=>setOff(window.scrollY*.38));};
    window.addEventListener('scroll',fn,{passive:true});
    return()=>{window.removeEventListener('scroll',fn);if(raf) cancelAnimationFrame(raf);};
  },[]);
  return off;
}

  <svg width="20" height="20" viewBox="0 0 24 24">

    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
  </svg>
);

function Reviews(){
  const {t}=useContext(Ctx);
  const r=useReveal();
  const [idx,setIdx]=useState(0);
  const [paused,setPaused]=useState(false);
  const [expanded,setExpanded]=useState({});
  const containerRef=useRef(null);
  const [cw,setCw]=useState(0);
  const [winW,setWinW]=useState(typeof window!=='undefined'?window.innerWidth:1200);

  const items=t.reviews.items;
  const GAP=22;
  const vis=winW>=900?3:1;
  const max=Math.max(0,items.length-vis);
  const cardW=cw>0?(cw-(vis-1)*GAP)/vis:0;
  const step=cardW+GAP;
  const TRUNC=120;

  useEffect(()=>{
    const measure=()=>{
      setWinW(window.innerWidth);
      if(containerRef.current) setCw(containerRef.current.offsetWidth);
    };
    measure();
    window.addEventListener('resize',measure);
    return()=>window.removeEventListener('resize',measure);
  },[]);

  useEffect(()=>{ setIdx(i=>Math.min(i,max)); },[max]);

  useEffect(()=>{
    if(paused) return;
    const tm=setInterval(()=>setIdx(i=>i>=max?0:i+1),4000);
    return()=>clearInterval(tm);
  },[paused,max]);

  const prev=()=>setIdx(i=>i<=0?max:i-1);
  const next=()=>setIdx(i=>i>=max?0:i+1);

  return(
    <section id="reviews" style={{padding:'80px 24px',background:'white'}}>
      <div style={{maxWidth:1100,margin:'0 auto'}}>

        {/* ── Header ── */}
        <div className="rv" ref={r} style={{textAlign:'center',marginBottom:42}}>
          <a href="https://www.google.com/maps/place/Crown+Beauty+Salon/@36.87245,30.6372035,17z/data=!3m1!4b1!4m6!3m5!1s0x14c391a25ec40317:0xe7d49477b062d12c!8m2!3d36.8724457!4d30.6397784!16s%2Fg%2F11f_1bdg_5!5m1!1e1?entry=ttu&g_ep=EgoyMDI2MDUwNi4wIKXMDSoASAFQAw%3D%3D" target="_blank" rel="noopener noreferrer" className="google-badge">
            <GOOGLE_G/>
            <span style={{fontSize:'.9rem',fontWeight:600,color:'#5f6368',letterSpacing:.01}}>Отзывы с Google</span>
            <span style={{color:'#e0e0e0',margin:'0 2px'}}>|</span>
            <span style={{fontFamily:'Playfair Display,serif',fontSize:'1.25rem',fontWeight:700,color:'#2D2D2D',lineHeight:1}}>4.6</span>
            <span style={{color:'#E91E8C',fontSize:'.9rem',letterSpacing:1}}>★★★★★</span>
            <span style={{fontSize:'.75rem',color:'#aaa'}}>230 отзывов</span>
          </a>
          <div>
            <span style={{fontSize:'.72rem',letterSpacing:'.24em',textTransform:'uppercase',color:'#E91E8C',fontWeight:700}}>✦ Google Reviews ✦</span>
          </div>
          <h2 style={{fontSize:'clamp(26px,5vw,50px)',fontWeight:700,color:'#2D2D2D',margin:'10px 0 9px'}}>{t.reviews.title}</h2>
          <p style={{color:'#999',fontSize:'1rem'}}>{t.reviews.sub}</p>
        </div>

        {/* ── Carousel ── */}
        <div style={{position:'relative'}} onMouseEnter={()=>setPaused(true)} onMouseLeave={()=>setPaused(false)}>
          <button className="rv-arr" onClick={prev} style={{left:0}} aria-label="Назад">‹</button>
          <div ref={containerRef} style={{overflow:'hidden',margin:'0 54px',borderRadius:4}}>
            <div style={{
              display:'flex',
              gap:GAP,
              transition:cw?'transform .55s cubic-bezier(.23,1,.32,1)':'none',
              transform:cardW?`translateX(${-idx*step}px)`:'none',
              willChange:'transform',
              paddingBottom:4
            }}>
              {items.map((rv,i)=>{
                const isLong=rv.text.length>TRUNC;
                const isExp=!!expanded[i];
                const w=cardW||280;
                return(
                  <div key={i} className="rvcard-wrap" style={{width:w,minWidth:w,maxWidth:w}}>
                    <div className="rvcard">

                      {/* name row */}
                      <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
                        <div className="rvcard-av">{rv.name[0]}</div>
                        <div style={{flex:1,minWidth:0}}>
                          <div style={{fontWeight:700,fontSize:'.93rem',color:'#2D2D2D',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{rv.name}</div>
                          <div style={{fontSize:'.71rem',color:'#bbb',marginTop:2}}>{rv.time}</div>
                        </div>
                        <GOOGLE_G/>
                      </div>

                      {/* stars */}
                      <div className="rvcard-stars" style={{marginBottom:12}}>★★★★★</div>

                      {/* text */}
                      <p style={{fontSize:'.87rem',color:'#555',lineHeight:1.75,margin:0}}>
                        {isLong&&!isExp?rv.text.slice(0,TRUNC)+'…':rv.text}
                        {isLong&&!isExp&&(
                          <button onClick={e=>{e.stopPropagation();setExpanded(x=>({...x,[i]:true}))}}
                            style={{background:'none',border:'none',color:'#E91E8C',fontSize:'.81rem',fontWeight:600,cursor:'pointer',padding:'0 0 0 4px',fontFamily:'Inter,sans-serif',display:'inline'}}>
                            Читать далее
                          </button>
                        )}
                      </p>

                    </div>
                  </div>
                );
              })}
            </div>
          </div>
          <button className="rv-arr" onClick={next} style={{right:0}} aria-label="Далее">›</button>
        </div>

        {/* ── Dots ── */}
        <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:26}}>
          {Array.from({length:max+1}).map((_,i)=>(
            <div key={i} onClick={()=>setIdx(i)} style={{
              width:i===idx?28:8,height:8,borderRadius:4,
              background:i===idx?'#E91E8C':'#FCE4EC',
              cursor:'pointer',transition:'all .3s'
            }}/>
          ))}
        </div>
      </div>
    </section>
  );
}

/* ═══════════════════════════════════════════════
   FLOATING BUTTONS (Liquid Glass)
═══════════════════════════════════════════════ */
function ScrollTopBtn(){
  const [visible,setVisible]=useState(false);
  const [pct,setPct]=useState(0);
  useEffect(()=>{
    const fn=()=>{
      const y=window.scrollY;
      setVisible(y>400);
      const total=document.body.scrollHeight-window.innerHeight;
      if(total>0) setPct((y/total)*100);
    };
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  const R=22;
  const circ=2*Math.PI*R;
  const offset=circ-(pct/100)*circ;
  return(
    <button className="stt-btn" onClick={()=>window.scrollTo({top:0,behavior:'smooth'})} aria-label="Наверх"
      style={{opacity:visible?1:0,transform:visible?'translateY(0) scale(1)':'translateY(22px) scale(.65)',pointerEvents:visible?'auto':'none'}}>
      {/* Pulsing ring */}
      {visible&&<div className="stt-ring"/>}
      {/* SVG progress arc */}
      <svg width="54" height="54" style={{position:'absolute',inset:0,transform:'rotate(-90deg)'}}>
        <defs>
          <linearGradient id="sttGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stopColor="#E91E8C"/>
            <stop offset="100%" stopColor="#F9A8C9"/>
          </linearGradient>
        </defs>
        {/* Track */}
        <circle cx="27" cy="27" r={R} fill="none" stroke="rgba(233,30,140,.18)" strokeWidth="2.5"/>
        {/* Progress */}
        <circle cx="27" cy="27" r={R} fill="none"
          stroke="url(#sttGrad)" strokeWidth="2.5" strokeLinecap="round"
          strokeDasharray={circ} strokeDashoffset={offset}
          style={{transition:'stroke-dashoffset .14s linear'}}/>
      </svg>
      {/* Glass button face */}
      <div className="stt-inner">
        <svg className="stt-arrow" width="15" height="15" viewBox="0 0 24 24" fill="none"
          stroke="white" strokeWidth="2.8" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
      </div>
    </button>
  );
}
